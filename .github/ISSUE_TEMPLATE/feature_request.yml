name: 功能建议
description: 提交明确、可执行的改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这项功能？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 现有方式哪里不够用？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请优先描述最小可行方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
  - type: dropdown
    id: frequency
    attributes:
      label: 使用频率
      options:
        - 每天
        - 每周
        - 偶尔
        - 只遇到过一次
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues 和 Discussions，没有发现相同建议
          required: true
        - label: 我没有附带 Token、完整会话或其他敏感信息
          required: true
