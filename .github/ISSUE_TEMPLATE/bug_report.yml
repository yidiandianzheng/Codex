name: Bug 报告
description: 报告可以稳定复现的错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 Token、完整会话内容、账号信息和私人绝对路径。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 应用版本、Git 提交或安装日期
      placeholder: "例如：main @ abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: macOS 版本、芯片型号、Codex 客户端版本
      placeholder: "例如：macOS 15.x，Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 可选；请勿提交访问令牌、完整会话或个人路径
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，没有发现相同问题
          required: true
        - label: 我已移除敏感信息
          required: true
